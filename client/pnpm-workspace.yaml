packages:
  - '.'

# pnpm 11+ build-script approvals. The old `onlyBuiltDependencies` /
# `ignoredBuiltDependencies` lists are gone; everything goes through this
# single map (true = run the script, false = silently skip).
allowBuilds:
  esbuild: true
  msw: false
  tldjs: true

minimumReleaseAgeExclude:
  - rulesync@16.17.0
