name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> version $VERSION"

      - name: Verify version is consistent across manifests
        shell: bash
        run: bash .github/scripts/verify-version.sh "${{ steps.meta.outputs.version }}"

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/extract-changelog-notes.sh "${{ steps.meta.outputs.version }}" release_notes.md

      - name: Upload release notes for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1
          if-no-files-found: error

      - id: draft
        name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          prerelease: false

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            updater: true
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            updater: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            updater: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
            updater: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles deb,rpm
            updater: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup ASIO SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASIO_SDK_URL: ${{ vars.ASIO_SDK_URL }}
          ASIO_SDK_SHA256: ${{ vars.ASIO_SDK_SHA256 }}
        run: |
          Invoke-WebRequest $env:ASIO_SDK_URL -OutFile asio.zip

          $actual = (Get-FileHash asio.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:ASIO_SDK_SHA256) {
            throw "ASIO SDK checksum mismatch: $actual"
          }

          Expand-Archive asio.zip -DestinationPath "$env:RUNNER_TEMP/asio-sdk"
          "CPAL_ASIO_DIR=$env:RUNNER_TEMP/asio-sdk/ASIOSDK" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Download release notes
        if: matrix.updater
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - id: notes
        if: matrix.updater
        name: Load release notes for updater JSON
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release_notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, bundle, and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        with:
          projectPath: ./client
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ matrix.updater }}

  build-server:
    name: Build server ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      # `rust-embed` reads `client/dist/` at compile time, so the React bundle
      # must exist before `cargo build -p server` runs.
      - name: Build frontend bundle
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server binary
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: cargo build --release --locked -p server --target ${{ matrix.target }}

      - name: Package server tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/server dist/nightingale
          tar -C dist -czf nightingale-server-${{ matrix.target }}.tar.gz nightingale
          sha256sum nightingale-server-${{ matrix.target }}.tar.gz \
            > nightingale-server-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            nightingale-server-${{ matrix.target }}.tar.gz
            nightingale-server-${{ matrix.target }}.tar.gz.sha256
