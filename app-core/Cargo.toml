[package]
name = "app-core"
version = "1.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
walkdir = "2"
blake3 = "1"
lofty = "0.23"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
rand = "0.9"
tiny_http = "0.12.0"
tracing = "0.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
url = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
md-5 = "0.10"
rust_cast = "0.21"
rustls = "0.23"
strsim = "0.11"
mime_guess = "2"
ab_glyph = "0.2"

[build-dependencies]
dotenvy = "0.15"
